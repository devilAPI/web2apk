<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Build Android WebView apps from a URL.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="web2apk">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>web2apk</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { background: #121212; margin: 0; height: 100%; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 24px;
      font-family: system-ui, sans-serif; color: #e3e3e3;
      transition: opacity .3s ease; z-index: 9999; background: #121212;
    }
    #splash.done { opacity: 0; pointer-events: none; }
    #splash img { width: 96px; height: 96px; border-radius: 22px; }
    #splash .bar {
      width: 160px; height: 4px; border-radius: 2px; overflow: hidden;
      background: #2a2f36;
    }
    #splash .bar::after {
      content: ""; display: block; width: 40%; height: 100%;
      border-radius: 2px; background: #2196F3;
      animation: slide 1.2s ease-in-out infinite;
    }
    @keyframes slide {
      from { transform: translateX(-100%); }
      to { transform: translateX(250%); }
    }
    @media (prefers-reduced-motion: reduce) {
      #splash .bar::after { animation: none; width: 100%; opacity: .6; }
    }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-label="Loading web2apk">
    <img src="icons/Icon-192.png" alt="">
    <div class="bar"></div>
  </div>
  <script>
    // Fade the splash out once Flutter has drawn its first frame.
    window.addEventListener('flutter-first-frame', function () {
      const splash = document.getElementById('splash');
      splash.classList.add('done');
      setTimeout(function () { splash.remove(); }, 300);
    }, { once: true });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // GitHub Pages lets browsers cache index.html for 10 minutes, so a page
    // opened again soon may be an older build. Ask for the deployed build,
    // past every cache, and reload once onto it. CI fills in the build
    // number (tool/web_cache_bust.sh); local builds skip the check.
    (function () {
      const build = '__BUILD_NUMBER__';
      if (!/^[0-9]+$/.test(build)) return;
      fetch('version.json', { cache: 'no-store' })
        .then((r) => r.json())
        .then((v) => {
          const live = String(v.build_number);
          let tried = null;
          try { tried = sessionStorage.getItem('reloadedFor'); } catch (_) {}
          if (live === build || tried === live) return;
          try { sessionStorage.setItem('reloadedFor', live); } catch (_) {}
          location.reload();
        })
        .catch(() => {});
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
